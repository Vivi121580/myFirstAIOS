[project]
name = "myfirstaios"
version = "0.1.0"
description = "Personal AI capability repository"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }

dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.4",
  "openai>=1.0.0",
  "requests>=2.31.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
