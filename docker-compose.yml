version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=myFirstAIOS
      - APP_ENV=development
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - .:/app
